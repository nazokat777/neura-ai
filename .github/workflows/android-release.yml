name: Android — Play uchun AAB (imzolangan)

# Google Play'ga yuklanadigan faylni yasaydi (app-release.aab).
# Mavjud android.yml faqat DEBUG APK yasaydi — u Play'ga yaramaydi.
#
# KERAK (repo secretlari, keystore-gen workflow'idan olinadi):
#   ANDROID_KEYSTORE_B64       — android.keystore faylining base64'i
#   ANDROID_KEYSTORE_PASSWORD  — o'sha kalitning paroli
# Secret bo'lmasa build TO'XTAYDI (jimgina imzosiz fayl chiqarmaydi —
# imzosiz AAB Play'ga yaramaydi va vaqt yeydi).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-release.yml'
      - 'android/**'
      - 'capacitor.config.ts'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secretlarni tekshirish
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 yoki ANDROID_KEYSTORE_PASSWORD yo'q."
            echo "::error::Avval 'Keystore yaratish (bir marta)' workflow'ini ishlating va secretlarni qo'ying."
            exit 1
          fi
          echo "Secretlar joyida."

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Veb qismni yig'ish (Next statik eksport -> out/)
        run: npx next build && node scripts/capacitor-entry.mjs

      - name: Android loyihasi + ikonkalar
        run: |
          npx cap add android || true
          npx --yes @capacitor/assets generate --android
          npx cap sync android

      - name: Imzo kalitini tiklash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$KS_B64" | base64 -d > android/app/keystore.jks

      - name: AAB + APK yig'ish (imzolangan)
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/app/keystore.jks \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias=neura \
            -Pandroid.injected.signing.key.password="$KS_PASS"

      - name: Chiqishlarni yig'ish
        run: |
          mkdir -p out
          find android/app/build/outputs -name "*.aab" -o -name "*.apk" | while read f; do cp "$f" out/; done
          ls -la out

      - name: Imzo tekshiruvi (imzosiz fayl Play'ga yaramaydi)
        run: |
          AAB=$(ls out/*.aab 2>/dev/null | head -1)
          [ -n "$AAB" ] || { echo "::error::AAB topilmadi"; exit 1; }
          unzip -l "$AAB" | grep -qi "META-INF/.*\.RSA\|META-INF/.*\.EC\|META-INF/MANIFEST.MF" \
            || { echo "::error::AAB imzolanmaganga o'xshaydi"; exit 1; }
          echo "AAB tayyor va imzolangan: $AAB"

      - uses: actions/upload-artifact@v4
        with:
          name: neura-ai-play
          path: out/*
          if-no-files-found: error

      - name: Releases'ga chiqarish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: play-latest
          name: Neura AI — Play (AAB + APK)
          body: |
            app-release.aab  -> Google Play Console'ga yuklanadi
            app-release.apk  -> telefonga sideload (sinov uchun)
          files: out/*
