name: Keystore yaratish (bir marta)

# Play Store uchun DOIMIY imzo kaliti yaratadi.
# Bir marta ishga tushiriladi, natija ARTEFAKT sifatida chiqadi (log'ga YOZILMAYDI).
# Artefaktni yuklab oling -> ichidagi ikki qiymatni repo secretlariga qo'ying:
#   ANDROID_KEYSTORE_B64       (keystore.b64.txt ichidagi matn)
#   ANDROID_KEYSTORE_PASSWORD  (password.txt ichidagi matn)
# Keyin artefaktni o'chiring va faylni saqlab qo'ying — kalit YO'QOLSA ilovani
# boshqa yangilab bo'lmaydi (Play buni talab qiladi).

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Kalit yaratish
        run: |
          mkdir -p out
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v \
            -keystore out/android.keystore -alias neura \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Neura AI, OU=Just AI It, O=Just AI It, L=Tashkent, C=UZ"
          base64 -w0 out/android.keystore > out/keystore.b64.txt
          printf '%s' "$PASS" > out/password.txt
          echo "Kalit yaratildi. Parol va base64 artefakt ichida (log'da EMAS)."
          keytool -list -v -keystore out/android.keystore -alias neura -storepass "$PASS" 2>/dev/null | grep -i "SHA256:" || true

      - name: Artefakt (maxfiy — yuklab oling va o'chiring)
        uses: actions/upload-artifact@v4
        with:
          name: neura-keystore-MAXFIY
          path: out/
          retention-days: 1
